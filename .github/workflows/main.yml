name: Build Mochi Island for Windows

on:
  workflow_dispatch:
  push:
    paths:
      - 'mochi-island-desktop.zip'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract project ZIP on the hosted runner
        shell: pwsh
        run: |
          $archive = Join-Path $env:GITHUB_WORKSPACE 'mochi-island-desktop.zip'
          if (-not (Test-Path -LiteralPath $archive)) {
            throw 'Upload mochi-island-desktop.zip to the repository root first.'
          }
          $extractRoot = Join-Path $env:RUNNER_TEMP 'mochi-source'
          Expand-Archive -LiteralPath $archive -DestinationPath $extractRoot -Force
          $project = Join-Path $extractRoot 'mochi-island-desktop'
          if (-not (Test-Path -LiteralPath (Join-Path $project 'package.json'))) {
            throw 'Could not find package.json inside the project ZIP. Make sure you uploaded the original project ZIP.'
          }
          "MOCHI_PROJECT=$project" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        shell: pwsh
        run: npm install
        working-directory: ${{ env.MOCHI_PROJECT }}

      - name: Build Windows installers
        shell: pwsh
        run: npm run tauri:build
        working-directory: ${{ env.MOCHI_PROJECT }}

      - name: Upload Windows installers
        uses: actions/upload-artifact@v7
        with:
          name: Mochi-Island-Windows-Installers
          path: ${{ runner.temp }}/mochi-source/mochi-island-desktop/src-tauri/target/release/bundle/
          if-no-files-found: error
          retention-days: 14
