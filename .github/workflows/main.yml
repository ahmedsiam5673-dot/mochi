name: Build Mochi Island for Windows

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Locate project source or ZIP
        id: locate
        shell: pwsh
        run: |
          $workspace = $env:GITHUB_WORKSPACE
          $project = $null

          # Prefer the source files already uploaded directly to the repository root.
          if ((Test-Path (Join-Path $workspace 'package.json')) -and
              (Test-Path (Join-Path $workspace 'src-tauri\Cargo.toml'))) {
            $project = $workspace
          }

          # Otherwise, locate and extract the project's ZIP anywhere in the repository.
          if (-not $project) {
            $archives = @(Get-ChildItem -Path $workspace -Filter 'mochi-island-desktop.zip' -Recurse -File |
              Where-Object { $_.FullName -notmatch '[\\/]\.git[\\/]' } |
              Sort-Object { $_.FullName.Length })

            if ($archives.Count -gt 0) {
              $extractRoot = Join-Path $env:RUNNER_TEMP 'mochi-source'
              New-Item -ItemType Directory -Path $extractRoot -Force | Out-Null
              Expand-Archive -LiteralPath $archives[0].FullName -DestinationPath $extractRoot -Force
              $packageFiles = Get-ChildItem -Path $extractRoot -Filter 'package.json' -Recurse -File
              foreach ($packageFile in $packageFiles) {
                $candidate = $packageFile.Directory.FullName
                if (Test-Path (Join-Path $candidate 'src-tauri\Cargo.toml')) {
                  $project = $candidate
                  break
                }
              }
            }
          }

          if (-not $project) {
            throw 'Project source not found. Upload the project source files (package.json and src-tauri/Cargo.toml) to the repository root, or add mochi-island-desktop.zip.'
          }

          "project_path=$project" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Building project at: $project"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        shell: pwsh
        working-directory: ${{ steps.locate.outputs.project_path }}
        run: npm install

      - name: Build Windows installers
        shell: pwsh
        working-directory: ${{ steps.locate.outputs.project_path }}
        run: npm run tauri:build

      - name: Upload Windows installers
        uses: actions/upload-artifact@v7
        with:
          name: Mochi-Island-Windows-Installers
          path: ${{ steps.locate.outputs.project_path }}/src-tauri/target/release/bundle/
          if-no-files-found: error
          retention-days: 14
